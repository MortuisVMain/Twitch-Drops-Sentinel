<!DOCTYPE html>
<html><head><title>Steam Community :: Steam Badges</title></head>
<body>
<!-- Sanitized from a real badges page (profile id and persona name replaced, wording switched to the English UI). -->
<div class="badges_sheet">
	<div id="badge_badge_2" data-panel="{&quot;clickOnActivate&quot;:&quot;firstChild&quot;}" role="button" class="badge_row is_link">
		<a class="badge_row_overlay" href="https://steamcommunity.com/profiles/PROFILE_ID/badges/2"></a>
		<div class="badge_row_inner">
			<div class="badge_title_row">
				<div class="badge_title">
					Community Ambassador									&nbsp;<span class="badge_view_details">View details</span>
				</div>
			</div>
			<div class="badge_title_rule"></div>
			<div class="badge_content">
				<div class="badge_progress_info">
					Tasks remaining: 23<br>
					<span class="progress_info_bold">
						5 of 28 completed									</span>
				</div>
			</div>
		</div>
	</div>
	<div id="badge_gamebadge_386180_1_0" data-panel="{&quot;clickOnActivate&quot;:&quot;firstChild&quot;}" role="button" class="badge_row is_link">
		<a class="badge_row_overlay" href="https://steamcommunity.com/profiles/PROFILE_ID/gamecards/386180/"></a>
		<div class="badge_row_inner">
			<div class="badge_title_row">
				<div class="badge_title_stats">
					<div class="badge_title_stats_content">
						<div class="badge_title_stats_playtime">
							&nbsp;
							1,017 hrs on record																					</div>
						<div class="badge_title_stats_drops">
							<span class="progress_info_bold">No card drops remaining</span>
							<span class="how_to_get_card_drops_ctn">
								&nbsp;<a class="whiteLink how_to_get_card_drops" href="javascript:ShowCardDropInfo( &quot;Crossout Remastered&quot;, 'card_drop_info_gamebadge_386180_1_0' );">How can I get more?</a>
							</span>
							<div class="card_drop_info_dialog" id="card_drop_info_gamebadge_386180_1_0" style="display: none;">
								<div class="card_drop_info_header">Card drops remaining: 0</div>
							</div>
						</div>
					</div>
				</div>
				<div class="badge_title">
					Crossout Remastered																		&nbsp;<span class="badge_view_details">View details</span>
				</div>
			</div>
			<div class="badge_title_rule"></div>
			<div class="badge_content">
				<div class="badge_progress_info">
					Cards collected: 0 of 9																	</div>
			</div>
		</div>
	</div>
</div>
</body></html>
