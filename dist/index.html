"Не удалось получить состояние задания. Нажмите, чтобы попробовать ещё раз":"Could not read the task state. Click to try again","Задание ещё не создано в Планировщике Windows. Нажмите, чтобы создать его":"The task does not exist in Windows Task Scheduler yet. Click to create it","Автосбор по расписанию не запускается: задание ещё не создано. Выберите дни или нажмите кнопку выше.":"Scheduled auto-claim is not running: the task has not been created yet. Pick the days or press the button above.","Не удалось изменить расписание автосбора":"Could not change the auto-claim schedule","Ошибка сети при изменении расписания автосбора":"Network error while changing the auto-claim schedule","Для автосбора раздач нужен Node.js 20 или новее (nodejs.org). Установите его и включите автосбор ещё раз.":"Auto-claim needs Node.js 20 or newer (nodejs.org). Install it and turn auto-claim on again.","Не удалось проверить задание автосбора. Подробности в журнале приложения.":"Could not check the auto-claim task. See the application log for details.","Для бесплатных раздач нужен Node.js 20 или новее (nodejs.org). Установите его и запустите сбор ещё раз.":"Free giveaways need Node.js 20 or newer (nodejs.org). Install it and start the claim again.","Планировщик Windows не ответил вовремя. Попробуйте ещё раз.":"Windows Task Scheduler did not respond in time. Please try again.","Планировщик Windows не ответил. Попробуйте ещё раз.":"Windows Task Scheduler did not respond. Please try again.","Не удалось изменить задание в Планировщике Windows. Подробности в журнале приложения.":"Could not change the task in Windows Task Scheduler. See the application log for details.","Активен — нажмите для отключения":"Active — click to turn off","Отключен — нажмите для включения":"Off — click to turn on","Бесплатные раздачи":"Free giveaways","Забираем бесплатные игры и ассеты в 7 магазинах":"Claiming free games and assets in 7 stores","Фоновый режим:":"Background mode:","Войти в аккаунт":"Sign in to the account","КОЛЛЕКЦИЯ ·":"COLLECTION ·","Тайтлы не найдены по заданным критериям":"No titles match the given criteria","Пока ничего не получено":"Nothing claimed yet","Подключите магазин, чтобы начать.":"Connect a store to get started.",ПЛАНИРОВЩИК:"SCHEDULER","Дни автосбора:":"Auto-claim days:","Журнал пуст — появится после первого автосбора":"The log is empty — it appears after the first auto-claim",Дашборд:"Dashboard","Советы по дашборду и фарму":"Dashboard and farming tips","Фарм без видео":"Farming without video","Sentinel общается с серверами Twitch напрямую, не скачивая видеопоток. Видеокарта не нагружается, а трафик экономится: до 2,5 ГБ в час.":"Sentinel talks to Twitch servers directly without downloading the video stream. The GPU stays idle and traffic is saved: up to 2.5 GB per hour.","Замена зависшего стрима":"Replacing a stuck stream","Если стример закончил эфир, выключил дропы или минуты перестали идти, Sentinel сам перейдёт на другого стримера. Включается в Настройках: «Менять зависший стрим».":"If the streamer went offline, turned drops off or the minutes stopped counting, Sentinel switches to another streamer by itself. Turn it on in Settings: “Replace a stuck stream”.",Автозамена:"Auto-replace","Принудительный фокус на игре":"Forced focus on a game","Хотите забрать дроп конкретной игры вне очереди? Используйте выпадающий список «Выбрать игру для фарма» в блоке ручного фокуса. После завершения сбора Sentinel сам вернется к обычной очереди.":"Want a specific game’s drop outside the queue? Use the “Pick a game to farm” list in the manual focus block. When the collection is done, Sentinel returns to the normal queue by itself.","Вне очереди":"Off-queue","Бонусные баллы канала":"Channel bonus points","Sentinel сам нажимает на сундуки с баллами на стримах (+50 за каждый), и вкладку браузера держать открытой не нужно. Включается в Настройках: «Собирать бонусные баллы канала».":"Sentinel clicks the point chests on streams itself (+50 each), so no browser tab has to stay open. Turn it on in Settings: “Collect channel bonus points”.","+50 очков":"+50 points","Полка игр":"Game shelf","Советы по управлению библиотекой и очередью":"Library and queue tips","Очередь по порядку (#1, #2, #3)":"Queue in order (#1, #2, #3)","Sentinel фармит игры из очереди строго сверху вниз. Порядок меняется стрелками на карточке игры. Вкладка «Активные кампании» показывает только то, что идёт прямо сейчас, новые кампании с меткой «НОВАЯ» стоят первыми.":"Sentinel farms the queue strictly from top to bottom. Change the order with the arrows on a game card. The “Active campaigns” tab shows only what is running right now; new campaigns tagged “NEW” come first.",Порядок:"Order","Автопоиск установленных игр на ПК":"Auto-detecting games installed on the PC","Сканер проверяет библиотеки Steam, Epic Games, GOG и пользовательские папки. Игры, найденные на вашем компьютере, автоматически отмечаются значком «Установлено на ПК».":"The scanner checks Steam, Epic Games, GOG libraries and custom folders. Games found on your computer are marked “Installed on PC” automatically.","Авто-сканер":"Auto-scanner","Исключения и скрытие лишних игр":"Exclusions and hiding extra games","Не хотите фармить игру — нажмите «Исключить» на карточке. Она уйдёт в список «Исключения»; он и список «Удалённые» открываются в меню справа от поиска.":"Don’t want to farm a game? Click “Exclude” on its card. It moves to the “Exclusions” list; that list and the “Removed” list open from the menu right of the search.",Исключения:"Exclusions","Вкладка «Собрано» и журнал Trophies.md":"The “Collected” tab and the Trophies.md log","Полученные награды попадают во вкладку «Собрано» с точным временем и записываются в файл Trophies.md рядом с программой. Блок «Трофеи» на других вкладках свёрнут в одну строку.":"Claimed rewards go to the “Collected” tab with the exact time and are written to Trophies.md next to the program. The “Trophies” block on other tabs is collapsed to one line.",Трофеи:"Trophies",Раздачи:"Giveaways","Советы по бесплатным раздачам":"Free giveaway tips","Вход в магазины в один клик":"One-click store sign-in","Выйти из этого аккаунта и войти в другой? Если закрыть окно браузера, не войдя, магазин останется без входа. У Fab вход через Epic Games: выйти придётся из обоих.":"Sign out of this account and sign in to another? If you close the browser window without signing in, the store stays signed out. Fab signs in through Epic Games, so both are signed out.","Нажмите «Войти в аккаунт» на карточке магазина. Откроется окно браузера: войдите один раз, и сессия сохранится. Сменить аккаунт можно кнопкой на карточке.":"Click “Sign in to the account” on a store card. A browser window opens: sign in once and the session is saved. Switch accounts with the button on the card.","Один раз":"Once","Быстрая проверка перед запуском":"Quick check before launch","Перед тяжёлым браузером для GOG и Steam сборщик быстро смотрит витрины. Если бесплатных игр сейчас нет, шаг завершается сразу и ПК не нагружается.":"Before the heavy browser for GOG and Steam, the claimer quickly checks the storefronts. If there are no free games now, the step ends immediately and the PC is not loaded.",Быстро:"Fast","Бесплатные ассеты Fab и Unity Store":"Free Fab and Unity Store assets","Помимо классических игр Epic Games Store, Sentinel автоматически забирает временные бесплатные паки для Unreal Engine (Fab) и Unity Asset Store прямо на ваш аккаунт разработчика.":"Besides classic Epic Games Store games, Sentinel automatically claims temporary free packs for Unreal Engine (Fab) and the Unity Asset Store straight to your developer account.","Фоновый режим":"Background mode","Кнопка «Фоновый режим» скрывает окно браузера: сборщик работает тихо и не перехватывает мышь и клавиатуру, можно спокойно работать или играть.":"The “Background mode” button hides the browser window: the claimer works quietly and does not grab the mouse or keyboard, so you can work or play undisturbed.","Без окна":"No window",Диммер:"Dimmer","Управление яркостью и экранами":"Brightness and screen control","Одна карточка на монитор":"One card per monitor","У каждого монитора свой ползунок, своя база и кнопка «Затемнить этот». Если монитор не принимает команды яркости, доступно только программное затемнение.":"Each monitor has its own slider, its own baseline and a “Dim this one” button. If a monitor does not accept brightness commands, only software dimming is available.","По мониторам":"Per monitor","База яркости":"Brightness baseline","Нажмите «Запомнить как базу», а потом меняйте яркость как угодно: «Вернуть к базе» (или Alt+Shift+Backspace) вернёт сохранённый уровень, даже из игры.":"Click “Save as baseline” and then change the brightness however you like: “Back to baseline” (or Alt+Shift+Backspace) restores the saved level, even from inside a game.",Возврат:"Restore",Настройки:"Settings","Советы по настройкам и защите ПК":"Settings and PC protection tips","Пауза, когда вы играете":"Pause while you play","Как только Sentinel замечает запущенную игру, он ставит фарм на паузу и не отнимает ресурсы у видеокарты и процессора. Закрыли игру — фарм продолжится.":"As soon as Sentinel notices a running game it pauses farming and takes no GPU or CPU resources. Close the game and farming continues.","Больше FPS":"More FPS","Выключить или усыпить ПК после очереди":"Shut down or sleep the PC after the queue","Когда все дропы очереди получены, Sentinel за 60 секунд предупредит и выполнит выбранное действие: сон, выключение или блокировка. Кнопка «Проверить таймер» только показывает отсчёт, ПК не трогает.":"When every drop in the queue is claimed, Sentinel warns you 60 seconds ahead and performs the chosen action: sleep, shutdown or lock. The “Test the timer” button only shows the countdown and does not touch the PC.","После очереди":"After the queue","Автообновление в 1 клик через GitHub":"One-click auto-update via GitHub","Sentinel проверяет релизы на GitHub. Когда выходит новая версия, её можно поставить прямо из приложения: вход, настройки и журнал сохранятся.":"Sentinel checks releases on GitHub. When a new version comes out you can install it right from the app: your sign-in, settings and log are kept.","Данные целы":"Data is kept","Диагностический отчет для поддержки":"Diagnostic report for support","Если что-то работает не так, кнопка «Отчет» внизу Настроек соберёт техническую сводку без паролей и токенов — её можно отправить на разбор.":"If something misbehaves, the “Report” button at the bottom of Settings builds a technical summary without passwords or tokens — you can send it in for analysis.","Без секретов":"No secrets","Переключение вкладок":"Switching tabs","Открывает соответствующую вкладку приложения":"Opens the matching tab of the app",Цифры:"Digits","Цифра открывает вкладку, если она не выключена в настройках":"A digit opens its tab if the tab is not turned off in Settings","Цифра открывает вкладку по порядку слева направо; выключенные вкладки пропускаются":"A digit opens the tabs in order from left to right; tabs turned off are skipped","Возвращает фарм из выбранной вручную игры к обычной очереди":"Returns the farm from a manually chosen game to the normal queue","Мгновенное закрытие справки, каталога или окна обновления":"Instantly closes help, the catalog or the update window","Палитра команд":"Command palette","Открывает быстрый переход и поиск по играм":"Opens quick navigation and game search","Режим PiP":"PiP mode","Переключает компактный режим окна":"Toggles the compact window mode","Сброс ручного фокуса":"Reset manual focus","Возвращает фарм из выбранной вручную игры к обычной очереди. На вкладке «Диммер» — блэкаут экранов":"Returns farming from the manually chosen game to the normal queue. On the “Dimmer” tab it blacks out the screens","Восстановить яркость":"Restore brightness","Возвращает сохраненную базовую яркость дисплеев":"Restores the saved baseline brightness of the displays","Обновить данные":"Refresh data","Заново
