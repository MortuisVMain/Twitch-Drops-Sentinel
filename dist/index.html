 запустите сбор ещё раз.":"Free giveaways need Node.js 20 or newer (nodejs.org). Install it and start the claim again.","Планировщик Windows не ответил вовремя. Попробуйте ещё раз.":"Windows Task Scheduler did not respond in time. Please try again.","Планировщик Windows не ответил. Попробуйте ещё раз.":"Windows Task Scheduler did not respond. Please try again.","Не удалось изменить задание в Планировщике Windows. Подробности в журнале приложения.":"Could not change the task in Windows Task Scheduler. See the application log for details.","Активен — нажмите для отключения":"Active — click to turn off","Отключен — нажмите для включения":"Off — click to turn on","Бесплатные раздачи":"Free giveaways","Забираем бесплатные игры и ассеты в 7 магазинах":"Claiming free games and assets in 7 stores","👁 Фоновый режим:":"👁 Background mode:","🔑 Войти в аккаунт":"🔑 Sign in to the account","КОЛЛЕКЦИЯ ·":"COLLECTION ·","Тайтлы не найдены по заданным критериям":"No titles match the given criteria","Пока ничего не получено":"Nothing claimed yet","Подключите магазин, чтобы начать.":"Connect a store to get started.",ПЛАНИРОВЩИК:"SCHEDULER","Дни автосбора:":"Auto-claim days:","Журнал пуст — появится после первого автосбора":"The log is empty — it appears after the first auto-claim",Дашборд:"Dashboard","Советы по дашборду и фарму":"Dashboard and farming tips","Фарм без видео":"Farming without video","Sentinel общается с серверами Twitch напрямую, не скачивая видеопоток. Видеокарта не нагружается, а трафик экономится: до 2,5 ГБ в час.":"Sentinel talks to Twitch servers directly without downloading the video stream. The GPU stays idle and traffic is saved: up to 2.5 GB per hour.","Замена зависшего стрима":"Replacing a stuck stream","Если стример закончил эфир, выключил дропы или минуты перестали идти, Sentinel сам перейдёт на другого стримера. Включается в Настройках: «Менять зависший стрим».":"If the streamer went offline, turned drops off or the minutes stopped counting, Sentinel switches to another streamer by itself. Turn it on in Settings: “Replace a stuck stream”.",Автозамена:"Auto-replace","Принудительный фокус на игре":"Forced focus on a game","Хотите забрать дроп конкретной игры вне очереди? Используйте выпадающий список «Выбрать игру для фарма ▾» в блоке ручного фокуса. После завершения сбора Sentinel сам вернется к обычной очереди.":"Want a specific game’s drop outside the queue? Use the “Pick a game to farm ▾” list in the manual focus block. When the collection is done, Sentinel returns to the normal queue by itself.","Вне очереди":"Off-queue","Бонусные баллы канала":"Channel bonus points","Sentinel сам нажимает на сундуки с баллами на стримах (+50 за каждый), и вкладку браузера держать открытой не нужно. Включается в Настройках: «Собирать бонусные баллы канала».":"Sentinel clicks the point chests on streams itself (+50 each), so no browser tab has to stay open. Turn it on in Settings: “Collect channel bonus points”.","+50 очков":"+50 points","Полка игр":"Game shelf","Советы по управлению библиотекой и очередью":"Library and queue tips","Очередь по порядку (#1, #2, #3)":"Queue in order (#1, #2, #3)","Sentinel фармит игры из очереди строго сверху вниз. Порядок меняется стрелками ▲ ▼ на карточке игры. Вкладка «Активные кампании» показывает только то, что идёт прямо сейчас, новые кампании с меткой «НОВАЯ» стоят первыми.":"Sentinel farms the queue strictly from top to bottom. Change the order with the ▲ ▼ arrows on a game card. The “Active campaigns” tab shows only what is running right now; new campaigns tagged “NEW” come first.",Порядок:"Order","Автопоиск установленных игр на ПК":"Auto-detecting games installed on the PC","Сканер проверяет библиотеки Steam, Epic Games, GOG и пользовательские папки. Игры, найденные на вашем компьютере, автоматически отмечаются значком «Установлено на ПК».":"The scanner checks Steam, Epic Games, GOG libraries and custom folders. Games found on your computer are marked “Installed on PC” automatically.","Авто-сканер":"Auto-scanner","Исключения и скрытие лишних игр":"Exclusions and hiding extra games","Не хотите фармить игру — нажмите «Исключить» на карточке. Она уйдёт в список «Исключения»; он и список «Удалённые» открываются в меню ⋯ справа от поиска.":"Don’t want to farm a game? Click “Exclude” on its card. It moves to the “Exclusions” list; that list and the “Removed” list open from the ⋯ menu right of the search.",Исключения:"Exclusions","Вкладка «Собрано» и журнал Trophies.md":"The “Collected” tab and the Trophies.md log","Полученные награды попадают во вкладку «Собрано» с точным временем и записываются в файл Trophies.md рядом с программой. Блок «Трофеи» на других вкладках свёрнут в одну строку.":"Claimed rewards go to the “Collected” tab with the exact time and are written to Trophies.md next to the program. The “Trophies” block on other tabs is collapsed to one line.",Трофеи:"Trophies",Раздачи:"Giveaways","Советы по бесплатным раздачам":"Free giveaway tips","Вход в магазины в один клик":"One-click store sign-in","Выйти из этого аккаунта и войти в другой? Если закрыть окно браузера, не войдя, магазин останется без входа. У Fab вход через Epic Games: выйти придётся из обоих.":"Sign out of this account and sign in to another? If you close the browser window without signing in, the store stays signed out. Fab signs in through Epic Games, so both are signed out.","Нажмите «🔑 Войти в аккаунт» на карточке магазина. Откроется окно браузера: войдите один раз, и сессия сохранится. Сменить аккаунт можно кнопкой ⇄ на карточке.":"Click “🔑 Sign in to the account” on a store card. A browser window opens: sign in once and the session is saved. Switch accounts with the ⇄ button on the card.","Один раз":"Once","Быстрая проверка перед запуском":"Quick check before launch","Перед тяжёлым браузером для GOG и Steam сборщик быстро смотрит витрины. Если бесплатных игр сейчас нет, шаг завершается сразу и ПК не нагружается.":"Before the heavy browser for GOG and Steam, the claimer quickly checks the storefronts. If there are no free games now, the step ends immediately and the PC is not loaded.",Быстро:"Fast","Бесплатные ассеты Fab и Unity Store":"Free Fab and Unity Store assets","Помимо классических игр Epic Games Store, Sentinel автоматически забирает временные бесплатные паки для Unreal Engine (Fab) и Unity Asset Store прямо на ваш аккаунт разработчика.":"Besides classic Epic Games Store games, Sentinel automatically claims temporary free packs for Unreal Engine (Fab) and the Unity Asset Store straight to your developer account.","Фоновый режим":"Background mode","Кнопка «Фоновый режим» скрывает окно браузера: сборщик работает тихо и не перехватывает мышь и клавиатуру, можно спокойно работать или играть.":"The “Background mode” button hides the browser window: the claimer works quietly and does not grab the mouse or keyboard, so you can work or play undisturbed.","Без окна":"No window",Диммер:"Dimmer","Управление яркостью и экранами":"Brightness and screen control","Одна карточка на монитор":"One card per monitor","У каждого монитора свой ползунок, своя база и кнопка «Затемнить только этот». Если монитор не принимает команды яркости, доступно только программное затемнение.":"Each monitor has its own slider, its own baseline and a “Dim only this one” button. If a monitor does not accept brightness commands, only software dimming is available.","По мониторам":"Per monitor","База яркости":"Brightness baseline","Нажмите «Запомнить как базу», а потом меняйте яркость как угодно: «Вернуть к базе» (или Alt+Shift+Backspace) вернёт сохранённый уровень, даже из игры.":"Click “Save as baseline” and then change the brightness however you like: “Back to baseline” (or Alt+Shift+Backspace) restores the saved level, even from inside a game.",Возврат:"Restore",Настройки:"Settings","Советы по настройкам и защите ПК":"Settings and PC protection tips","Пауза, когда вы играете":"Pause while you play","Как только Sentinel замечает запущенную игру, он ставит фарм на паузу и не отнимает ресурсы у видеокарты и процессора. Закрыли игру — фарм продолжится.":"As soon as Sentinel notices a running game it pauses farming and takes no GPU or CPU resources. Close the game and farming continues.","Больше FPS":"More FPS","Выключить или усыпить ПК после очереди":"Shut down or sleep the PC after the queue","Когда все дропы очереди получены, Sentinel за 60 секунд предупредит и выполнит выбранное действие: сон, выключение или блокировка. Кнопка «Проверить таймер» только показывает отсчёт, ПК не трогает.":"When every drop in the queue is claimed, Sentinel warns you 60 seconds ahead and performs the chosen action: sleep, shutdown or lock. The “Test the timer” button only shows the countdown and does not touch the PC.","После очереди":"After the queue","Автообновление в 1 клик через GitHub":"One-click auto-update via GitHub","Sentinel проверяет релизы на GitHub. Когда выходит новая версия, её можно поставить прямо из приложения: вход, настройки и журнал сохранятся.":"Sentinel checks releases on GitHub. When a new version comes out you can install it right from the app: your sign-in, settings and log are kept.","Данные целы":"Data is kept","Диагностический отчет для поддержки":"Diagnostic report for support","Если что-то работает не так, кнопка «Отчет» внизу Настроек соберёт техническую сводку без паролей и токенов — её можно отправить на разбор.":"If something misbehaves, the “Report” button at the bottom of Settings builds a technical summary without passwords or tokens — you can send it in for analysis.","Без секретов":"No secrets","Переключение вкладок":"Switching tabs","Открывает соответствующую вкладку приложения":"Opens the matching tab of the app","Палитра команд":"Command palette","Открывает быстрый переход и поиск по играм":"Opens quick navigation and game search","Режим PiP":"PiP mode","Переключает компактный режим окна":"Toggles the compact window mode","Сброс ручного фокуса":"Reset manual focus","Возвращает фарм из выбранной вручную игры к обычной очереди. На вкладке «Диммер» — блэкаут экранов":"Returns farming from the manually chosen game to the normal queue. On the “Dimmer” tab it blacks out the screens","Восстановить яркость":"Restore brightness","Возвращает сохраненную базовую яркость дисплеев":"Restores the saved baseline brightness of the displays","Обновить данные":"Refresh data","Заново запрашивает кампании у Twitch":"Fetches campaigns from Twitch again","Закрыть модальное окно":"Close the dialog","Мгновенное закрытие справки, каталога или окна обновления":"Instantly closes help, the catalog or the update window","Клик по иконке трея":"Click the tray icon","Свернуть / Развернуть":"Minimize / Restore","Прячет Sentinel в системный трей Windows для тихой работы в фоне":"Hides Sentinel in the Windows system tray for quiet background work","Двойной клик по шапке":"Double-click the title bar","Оконный режим":"Window mode","Переключение между полноэкранным и стандартным размером окна":"Switches between the maximized and standard window size","Колесико мыши":"Mouse wheel","Лог консоли":"Console log","Скролл ленты реального времени в терминале активности":"Scrolls the real-time feed in the activity terminal","Текущая открытая вкладка":"The currently open tab","Справка и горячие клавиши":"Help & hotkeys","Практические советы, правила работы и быстрые сочетания клавиш":"Practical tips, working rules and keyboard shortcuts",Клавиши:"Keys","Активная вкладка":"Active tab","Быстрые клавиши и управление":"Hotkeys and controls","Принцип автономности и безопасности Sentinel:":"How Sentinel stays autonomous and safe:","Все пароли, сессии и авторизационные токены хранятся исключительно в локальных файлах на вашем компьютере. Никаких внешних серверов, аналитики или облачных баз данных.":"All passwords, sessions and authorization tokens are stored only in local files on your computer. No external servers, analytics or cloud databases.","для закрытия":"to close","Всё понятно":"Got it",Основное:"Essentials","Вход уск завершился с ошибкой":"The last run ended with an error","Последний запуск был прерван и не проверил все магазины":"The last run was interrupted and did not check all the stores","Автосбор включён":"Auto-claim is on","Открыть страницу":"Open the page","Установить движок":"Install the engine","Войти в аккаунт":"Sign in to the account","Включить раздачи":"Turn giveaways on","Включить автосбор":"Turn auto-claim on",Выполнить:"Run","Twitch Drops Sentinel: готовность раздач":"Twitch Drops Sentinel: giveaways readiness","Версия приложения":"App version",Проверено:"Checked",Итог:"Summary","Сейчас идёт сбор или вход в магазин. Дождитесь конца и повторите":"A claim or a store sign-in is running. Wait for it to finish and try again","Сначала нужен Node.js":"Node.js is needed first","Не удалось запустить установку движка":"Could not start the engine installation","Сервис не отвечает, установка не началась":"The service does not respond, the installation did not start","Не удалось связаться с сервисом Sentinel. Проверка не выполнена":"Could not reach the Sentinel service. The check was not done","Сервис Sentinel ответил ошибкой. Проверка не выполнена":"The Sentinel service answered with an error. The check was not done","Сервис Sentinel ответил непонятно. Проверка не выполнена":"The Sentinel service gave an unreadable answer. The check was not done","Проверка не выполнена":"Check not done","Проверяем…":"Checking…","Готовность раздач":"Giveaways readiness","Что уже есть и что осталось сделать":"What is ready and what is left to do","Проверить ещё раз":"Check again","Скопировать отчёт":"Copy report","Не удалось скопировать":"Could not copy",Повторить:"Retry","Это последнее известное состояние входа: сессия могла истечь. Проверяется только во время сбора.":"This is the last known sign-in state: the session may have expired. It is only verified during a claim.","Все сайты открываются":"All sites open","✔ Проверить готовность":"✔ Check readiness","Что уже готово для раздач и что осталось сделать":"What is ready for giveaways and what is left to do","Есть незавершённые шаги":"There are unfinished steps","Вход подтверждён":"Sign-in confirmed","Следующий запуск":"Next run","Браузер для входа и сбора":"Browser for sign-in and claiming",Автовыбор:"Automatic","Встроенный Chromium":"Bundled Chromium","Google Chrome (не найден)":"Google Chrome (not found)","Microsoft Edge (не найден)":"Microsoft Edge (not found)","Встроенный Chromium (скачается при первом запуске)":"Bundled Chromium (downloaded on first run)","В этом браузере нужно войти в магазины заново: вход хранится отдельно для каждого браузера.":"You need to sign in to the stores again in this browser: sign-ins are kept separately for each browser.","Выбранный Google Chrome не найден. Выберите другой браузер ниже или установите его":"The selected Google Chrome was not found. Choose another browser below or install it","Выбранный Microsoft Edge не найден. Выберите другой браузер ниже или установите его":"The selected Microsoft Edge was not found. Choose another browser below or install it","Встроенный Chromium не найден":"The bundled Chromium was not found","Выбран Google Chrome":"Google Chrome is selected","Выбран Microsoft Edge":"Microsoft Edge is selected","Выбран встроенный Chromium":"The bundled Chromium is selected","Выбран встроенный Chromium. Он скачается при первом запуске":"The bundled Chromium is selected. It will be downloaded on first run","Браузер нельзя сменить, пока идёт сбор, вход в магазин или установка движка. Дождитесь конца и повторите":"The browser cannot be changed while a claim, a store sign-in or the engine install is running. Wait for it to end and try again","Сервис не принял этот браузер":"The service did not accept this browser","Не удалось сохранить выбор браузера":"Could not save the browser choice","Сервис не отвечает, браузер не изменён":"The service is not responding, the browser was not changed"},Gy={"↻ Пересканировать все диски":"↻ Rescan all drives","📦 Бэк
