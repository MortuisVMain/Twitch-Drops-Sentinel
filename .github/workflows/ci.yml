name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build UI & run verification suite
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build UI bundle
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run verification suite
        env:
          CI: '1'
        run: python test_sentinel_suite.py

      - name: Engine tests
        run: node --test "tools/engine_tests/*.test.mjs"

      - name: Build Steam idle helper and run its offline checks
        run: |
          dotnet build tools/steam_idle_probe/SteamIdleProbe.csproj -c Release
          Push-Location tools/steam_idle_probe/checks
          dotnet run -c Release --project SteamIdleProbe.Checks.csproj
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "Helper checks failed with exit code $code" }
