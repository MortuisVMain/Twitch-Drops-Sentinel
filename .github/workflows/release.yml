name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          npm ci
          npm run build

      - name: Build C# Standalone Host
        run: |
          dotnet publish desktop/TwitchDropsSentinel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish_exe
          Copy-Item -Path publish_exe/TwitchDropsSentinel.exe -Destination TwitchDropsSentinel.exe -Force

      - name: Setup Portable Python Runtime
        run: |
          python tools/setup_portable_runtime.py

      - name: Package Release Archives
        run: |
          python tools/create_clean_release.py

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Twitch_Drops_Sentinel_*_Public_Release.zip
            Twitch_Drops_Sentinel_Patch_*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
