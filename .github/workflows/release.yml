name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies for the test suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Read the release tag (an annotated tag whose message has [skip tests] skips the suite)
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch --force --depth=1 origin "+${env:GITHUB_REF}:${env:GITHUB_REF}"
          $type = git for-each-ref $env:GITHUB_REF --format='%(objecttype)'
          $message = git for-each-ref $env:GITHUB_REF --format='%(contents)'
          $skip = $type -eq 'tag' -and [bool]($message -match '\[skip tests\]')
          if ($skip) { Write-Output '::notice::The tag message asks to skip the verification suite: it was run locally on this commit before tagging.' }
          "skip=$($skip.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run verification suite (release is not built when it fails)
        if: steps.tag.outputs.skip != 'true'
        env:
          CI: '1'
        run: python test_sentinel_suite.py

      - name: Build C# Standalone Host
        run: |
          dotnet publish desktop/TwitchDropsSentinel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish_exe
          Copy-Item -Path publish_exe/TwitchDropsSentinel.exe -Destination TwitchDropsSentinel.exe -Force

      - name: Build Steam idle helper
        run: |
          dotnet publish tools/steam_idle_probe/SteamIdleProbe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o tools/steam_idle_probe/publish
          if (-not (Test-Path tools/steam_idle_probe/publish/SteamIdleProbe.exe)) { throw 'SteamIdleProbe.exe was not published' }

      - name: Setup Portable Python Runtime
        run: |
          python tools/setup_portable_runtime.py

      - name: Ensure Inno Setup 6 (installer compiler)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version 6.7.1 -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found after installing Inno Setup' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package Release Archives
        run: |
          python tools/create_clean_release.py
          if (-not (Test-Path Hell_Harvest_Setup_v*.exe)) { throw 'The installer was not built' }

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Hell_Harvest_*_Public_Release.zip
            Hell_Harvest_Setup_v*.exe
            Hell_Harvest_Patch_*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
